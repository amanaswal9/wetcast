# Requests to the API, per visitor address. Pages ask for a few things at once, so short bursts are
# fine; a steady flood (scraping, or hammering the CPU-heavy predictions) gets "429 Too Many Requests".
# The assistant is tighter still: its answers cost the most, on top of its own daily limits.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=assistant:10m rate=1r/s;

server {
  listen 80;
  root /usr/share/nginx/html;
  # Don't show the nginx version in errors and headers.
  server_tokens off;
  include /etc/nginx/conf.d/security-headers.inc;

  # API bodies are small (the largest is a 12-message chat), so anything big is refused before it
  # reaches the API.
  location /api/ {
    limit_req zone=api burst=30 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }

  location = /api/assistant {
    limit_req zone=assistant burst=3 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }

  location /assets/ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # nginx doesn't know the .webmanifest extension; name the type so browsers read it as a manifest.
  location ~ \.webmanifest$ {
    default_type application/manifest+json;
  }

  location / {
    # A folder with its own page (Wetcast Mini at /mini/) gets that page; anything else gets the app.
    try_files $uri $uri/index.html /index.html;
  }
}
