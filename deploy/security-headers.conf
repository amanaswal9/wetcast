# Security headers for every response. nginx drops inherited add_header lines in any block that
# sets its own, so nginx.conf includes this file in the server and in each such location.
# The public copy on Codeberg Pages takes its headers from here too (scripts/pages-headers.mjs), so keep
# the add_header lines on one line each, in the form add_header Name "value" always;

# Only Wetcast's own files may run as scripts (no inline scripts, no eval). Styles may be inline
# because React and Leaflet set style attributes; fonts may be embedded (Vite inlines the smallest ones). Data is fetched only from Wetcast's own API and
# Open-Meteo, and map images only from OpenStreetMap's tile server. The tile server is in connect-src too:
# the service worker fetches tiles itself to keep them for offline use, and its fetches count as connections.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://api.open-meteo.com https://geocoding-api.open-meteo.com https://archive-api.open-meteo.com https://air-quality-api.open-meteo.com https://tile.openstreetmap.org; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Don't guess file types from their contents.
add_header X-Content-Type-Options "nosniff" always;
# No other site may show Wetcast inside a frame (clickjacking); the CSP line above says the same for newer browsers.
add_header X-Frame-Options "DENY" always;
# Other sites see only "wetcast's address", never the page or place being looked at. OpenStreetMap's
# tile policy asks for a referrer, which this still sends.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Browser features: location and the microphone for this site only (My location, voice search); nothing else.
add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(), payment=(), usb=(), serial=(), bluetooth=(), midi=()" always;
# A window this site opens can't reach back into it, and the other way round.
add_header Cross-Origin-Opener-Policy "same-origin" always;
# When the site is served over https, add: Strict-Transport-Security "max-age=31536000; includeSubDomains"
