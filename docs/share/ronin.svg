    <path d="M300 200 C282 222 272 246 268 274" stroke="#000" stroke-width="6"/>
    <path d="M316 204 C298 232 290 260 292 292" stroke="#000" stroke-width="5"/>
    <path d="M330 214 C316 244 314 276 320 306" stroke="#000" stroke-width="5"/>
    <path d="M286 214 C270 230 262 248 258 262" stroke="#000" stroke-width="4"/>
    <path d="M436 280 C448 320 446 360 432 396" stroke="#000" stroke-width="6"/>
    <path d="M420 330 C426 368 420 400 404 428" stroke="#000" stroke-width="5"/>
    <path d="M446 250 C462 286 466 320 458 352" stroke="#000" stroke-width="4"/>
    <path d="M400 420 C398 440 392 456 382 468" stroke="#000" stroke-width="4"/>

    <!-- Topknot: the cord, then the loose tail flaring up and back. -->
    <ellipse cx="384" cy="176" rx="24" ry="18" transform="rotate(-35 384 176)" fill="#000" stroke="none"/>
    <path d="M368 186 L398 164" stroke="#fff" stroke-width="5"/>
    <path d="M374 194 L404 172" stroke="#fff" stroke-width="3"/>
    <path d="M394 162 C404 124 430 96 466 84 C452 104 446 124 446 146 C432 136 414 142 402 166 Z" fill="#000" stroke="none"/>
