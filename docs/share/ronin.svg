    <path d="M262 364 C268 370 276 374 286 374" stroke="#000" stroke-width="3"/>
    <!-- Ear, mostly under the hair. -->
    <path d="M330 296 C342 296 346 314 340 326 C336 332 330 332 328 328" stroke="#000" stroke-width="5" fill="#fff"/>

    <!-- Hair: crown and back of the head, falling long behind the neck and over the shoulder. -->
    <path d="M296 212 C312 176 352 160 390 172 C426 184 444 222 440 268
             C436 312 420 348 410 384 C404 404 404 420 410 436 L384 432
             C380 410 380 392 376 370 C368 344 352 322 346 300 C340 278 332 250 318 232
             C312 224 304 216 296 212 Z" fill="#000" stroke="none"/>
