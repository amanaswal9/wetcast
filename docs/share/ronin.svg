    <path d="M410 174 C440 162 466 170 484 194" stroke="#000" stroke-width="4"/>
    <path d="M388 140 C380 112 384 84 398 64" stroke="#000" stroke-width="3"/>
    <path d="M420 120 C440 100 462 92 480 70" stroke="#000" stroke-width="3"/>

    <!-- Sleeve around the wrists, joining the robe. -->
    <path d="M196 478 C222 470 252 474 272 486 C290 520 280 600 262 640 L196 640
             C188 590 188 530 196 478 Z" fill="#000" stroke="none"/>
    <path d="M214 500 C220 540 222 580 218 620" stroke="#555" stroke-width="4"/>

    <!-- Hands pressed together, fingertips up: outer palm, the four fingers and the thumb. -->
    <path d="M190 280 C188 266 196 256 206 258 C210 248 222 248 226 258
             C234 254 242 262 240 274 L244 300 C250 330 252 380 248 420
             C246 448 240 470 232 488 L198 488 C190 456 186 420 186 380
             C186 340 188 310 190 280 Z" fill="#fff" stroke="#000" stroke-width="6"/>
    <path d="M206 262 L208 338" stroke="#000" stroke-width="3"/>
    <path d="M222 258 L224 336" stroke="#000" stroke-width="3"/>
    <path d="M232 272 L234 334" stroke="#000" stroke-width="2"/>
    <path d="M198 346 C210 352 226 352 240 346" stroke="#000" stroke-width="3"/>
    <path d="M196 300 C202 304 210 304 216 300" stroke="#888" stroke-width="2"/>
    <path d="M244 364 C256 374 260 404 252 434" stroke="#000" stroke-width="5"/>
    <path d="M196 400 C200 430 202 456 200 480" stroke="#999" stroke-width="5"/>
    <path d="M226 420 C230 440 230 460 226 480" stroke="#bbb" stroke-width="4"/>
