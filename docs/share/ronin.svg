<svg xmlns="http://www.w3.org/2000/svg" viewBox="170 44 430 556" width="430" height="556">
  <!-- Original drawing for Wetcast's desktop: a lone ronin in profile, head bowed, hands
       pressed together. Black is ink; make_ronin_ascii.py turns it into ASCII art. -->
  <rect x="170" y="44" width="430" height="556" fill="#fff"/>
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- Robe: the back and shoulder, with pale fold lines so it isn't one solid block. -->
    <path d="M330 396 C392 384 468 404 518 452 C566 500 584 590 590 680 L196 680
             C206 610 224 548 254 500 C276 462 300 410 330 396 Z" fill="#000" stroke="none"/>
    <path d="M330 404 C318 436 306 462 290 492" stroke="#fff" stroke-width="7"/>
    <path d="M348 404 C344 440 336 470 324 500" stroke="#999" stroke-width="4"/>
    <path d="M470 446 C494 500 510 560 514 640" stroke="#666" stroke-width="5"/>
    <path d="M430 438 C444 500 452 560 450 640" stroke="#555" stroke-width="4"/>
    <path d="M540 520 C552 570 560 620 562 670" stroke="#666" stroke-width="4"/>
    <path d="M372 470 C386 520 392 580 388 650" stroke="#444" stroke-width="4"/>

    <!-- Sword hilt over the shoulder: wrapped grip, round guard, pale cord. -->
    <path d="M486 436 L556 344 L574 358 L504 450 Z" fill="#000" stroke="none"/>
    <path d="M506 418 L516 404 M520 398 L530 384 M534 378 L544 364" stroke="#fff" stroke-width="4"/>
    <ellipse cx="494" cy="446" rx="24" ry="9" transform="rotate(-53 494 446)" fill="#000" stroke="none"/>
    <path d="M500 452 C494 476 480 492 462 500" stroke="#bbb" stroke-width="4"/>

    <!-- Neck. -->
    <path d="M300 372 L348 362 L356 404 L312 410 Z" fill="#fff" stroke="#000" stroke-width="5"/>

    <!-- Face in profile, bowed: forehead, brow ridge, nose, lips, bearded chin, jaw. -->
    <path d="M296 212 C282 218 272 228 268 240 C264 252 262 260 260 266
             C264 272 262 280 256 290 C246 302 234 314 224 326
             C232 330 242 328 250 326 C246 328 246 334 250 338 C246 342 246 348 250 352
             C252 364 260 376 274 384 C292 392 314 386 326 372
             C336 356 340 332 338 306 C334 270 318 232 296 212 Z"
          fill="#fff" stroke="#000" stroke-width="5"/>
    <!-- Brow and closed eye: the downcast look. -->
    <path d="M264 266 C274 262 288 262 298 268" stroke="#000" stroke-width="7"/>
    <path d="M270 282 C278 288 290 288 298 282" stroke="#000" stroke-width="4"/>
    <path d="M276 290 C284 296 294 296 300 292" stroke="#999" stroke-width="3"/>
    <!-- Shadow under the cheekbone. -->
    <path d="M300 300 C308 312 312 324 312 336" stroke="#ccc" stroke-width="5"/>
    <!-- Moustache, mouth and beard. -->
    <path d="M246 326 C254 326 264 330 270 336" stroke="#000" stroke-width="5"/>
    <path d="M250 344 C256 344 262 346 266 348" stroke="#000" stroke-width="3"/>
    <path d="M254 354 C254 366 260 376 270 382 C286 390 310 386 324 372 C330 364 332 356 332 350
