<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="WeatherAI: spatial-temporal weather forecasting with LSTM, GRU and CNN-LSTM models, built on Open-Meteo data." />
    <title>WeatherAI</title>
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      try {
        var saved = localStorage.getItem('weatherai.theme')
        var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="unsupported" hidden style="max-width: 32rem; margin: 3rem auto; padding: 1rem 1.25rem; font: 16px/1.5 Verdana, sans-serif; background: #c0c0c0; color: #000; border: 2px solid #000">
      <p style="margin: 0 0 0.5rem; font-weight: bold">WeatherAI needs a newer browser</p>
      <p style="margin: 0">
        Please update to Safari 16.4 or later (iOS / iPadOS 16.4+), Chrome or Edge 111+, or Firefox 128+, then reload this page.
      </p>
    </div>
    <script>
      // Show a clear message instead of a blank page on browsers the app can't run in.
      ;(function () {
        var ok = true
        try {
          new Function('class A { static { } }')
        } catch (e) {
          ok = false
        }
        if (!(window.CSS && CSS.supports && CSS.supports('color', 'color-mix(in srgb, red, blue)'))) ok = false
        if (!ok) document.getElementById('unsupported').hidden = false
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
