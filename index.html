<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Open the connection to the map tile server early, so the first map tiles arrive sooner. -->
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
    <meta name="theme-color" content="#000080" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Wetcast: spatial-temporal weather forecasting with its own LSTM, GRU, CNN-LSTM, Transformer and LightGBM models, built on Open-Meteo data." />
    <!-- The fonts on the first screen (interface text, title bars, temperatures): fetch them straight away. -->
    <link rel="preload" href="/node_modules/@fontsource/noto-sans/files/noto-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource/noto-sans/files/noto-sans-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource/pixelify-sans/files/pixelify-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>Wetcast</title>
    <!-- Link previews (WhatsApp, Slack, social). Image source: docs/share/. Most sites need an
         absolute og:image URL: change it to https://<your host>/og-image.png once the app is hosted. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wetcast" />
    <meta property="og:title" content="Wetcast" />
    <meta property="og:description" content="Live weather next to its own trained forecasting models, scored against what really happened." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Wetcast in a classic grey desktop window: a pixel-art cloud and the names of its six forecasting models." />
    <meta name="twitter:card" content="summary_large_image" />
    <script src="/boot.js"></script>
  </head>
  <body>
    <div id="root"><!--
      Static copy of the app's window frame, styled by the app's own CSS (which loads before any
      JavaScript), so a phone shows the app's shape at once. React replaces it on start-up.
    --><div style="padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)" aria-hidden="true"><div class="min-h-dvh pb-[52px] sm:px-4 sm:pt-4 sm:pb-[64px] md:px-6 md:pt-6">
        <div class="mx-auto w-full max-w-[1200px]">
          <section class="r-window flex min-w-0 flex-col">
            <div class="r-title">
              <span class="flex shrink-0"><img src="/favicon.svg" width="16" height="16" alt="" /></span>
              <span class="m-0 min-w-0 flex-1 truncate font-bold">Wetcast</span>
            </div>
            <div class="r-menubar max-sm:hidden">
              <span class="r-menu-item">Dashboard</span><span class="r-menu-item">Forecast</span><span class="r-menu-item">Map</span><span class="r-menu-item">Ask</span><span class="r-menu-item">Analytics</span><span class="r-menu-item">Models</span><span class="r-menu-item">Locations</span><span class="r-menu-item">About</span>
            </div>
            <div class="r-divider max-sm:hidden"></div>
            <div class="p-1.5"><div class="r-skeleton" style="height: 28px; max-width: 420px"></div></div>
            <div class="r-divider"></div>
            <div class="grid gap-3 p-2 sm:p-3 lg:grid-cols-[minmax(0,360px)_minmax(0,1fr)]">
              <div class="r-skeleton" style="height: 220px"></div>
              <div class="r-skeleton" style="height: 220px"></div>
            </div>
          </section>
        </div>
      </div></div></div>
    <div id="unsupported" hidden style="max-width: 32rem; margin: 3rem auto; padding: 1rem 1.25rem; font: 16px/1.5 sans-serif; background: #c0c0c0; color: #000; border: 2px solid #000">
      <p style="margin: 0 0 0.5rem; font-weight: bold">Wetcast needs a newer browser</p>
      <p style="margin: 0">
        Please update to Safari 16.4 or later (iOS / iPadOS 16.4+), Chrome or Edge 111+, or Firefox 128+, then reload this page.
      </p>
    </div>
    <script src="/browser-check.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
