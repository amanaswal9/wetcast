<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Its own manifest, so Wetcast Mini installs as a separate small app next to Wetcast. -->
    <link rel="manifest" href="/mini/manifest.webmanifest" />
    <meta name="theme-color" content="#000080" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- iPhone and iPad: open full screen from the home screen, with this name under the icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Wetcast Mini" />
    <meta name="description" content="Wetcast Mini: the current weather and the next few hours, small enough to keep on screen." />
    <!-- The interface font, fetched straight away so the first paint uses it. -->
    <link rel="preload" href="/node_modules/@fontsource/noto-sans/files/noto-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource/noto-sans/files/noto-sans-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>Wetcast Mini</title>
    <!-- Same theme as the main app, applied before first paint. -->
    <script src="/boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/mini/main.tsx"></script>
  </body>
</html>
