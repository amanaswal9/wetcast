# Publishes the public copy to GitHub Pages: https://amanaswal9.github.io/wetcast/ (free, https).
#
# It runs after CI passes on main, and every 3 hours on its own, so the site always shows a recent
# forecast from Wetcast's own models. Each run builds the site from a clean checkout (nothing kept only
# on the owner's computer can end up in it), then backend/scripts/export_public_data.py runs the
# models for all 48 cities with live Open-Meteo data and writes the results next to the site as plain
# files. No server and no secrets: the job's own token publishes the site.
#
# GitHub turns scheduled runs off after 60 days without a push to the repository; a push, or
# "Enable workflow" on the Actions tab, turns them back on.
name: Publish

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a newer one waits rather than cancelling one already deploying.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Build, forecast and publish
    # After CI only when every check passed; scheduled and manual runs publish main as it is.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      VITE_PUBLIC_SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      VITE_PUBLIC_DATA: "1"
      TF_CPP_MIN_LOG_LEVEL: "3"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Security policy in the pages (from deploy/security-headers.conf)
        run: node scripts/pages-meta.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install the models' dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e ml
      - name: Run the models for every city
        working-directory: backend
        run: python -m scripts.export_public_data ../dist/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - id: deploy
        uses: actions/deploy-pages@v4
