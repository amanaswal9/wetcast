# Publishes the public copy to GitHub Pages: https://amanaswal9.github.io/wetcast/ (free, https).
#
# It runs after CI passes on main, and about every 3 hours on its own, so the site always shows a recent
# forecast from Wetcast's own models. Each run builds the site from a clean checkout (nothing kept only
# on a developer's computer can end up in it), then backend/scripts/export_public_data.py runs the
# models for all 90 cities with live Open-Meteo data and writes the results next to the site as plain
# files. No server and no secrets: the job's own token publishes the site.
#
# GitHub delays or drops scheduled runs when it is busy (here most 3-hourly slots never ran), so the
# schedule asks twice an hour and the "due" job lets a publish through only when the live forecast is
# at least 2 h 40 min old. Most scheduled runs stop there after a few seconds, a dropped slot costs
# half an hour instead of three, and Open-Meteo is called no more often than before.
#
# GitHub turns scheduled runs off after 60 days without a push to the repository; a push, or
# "Enable workflow" on the Actions tab, turns them back on.
name: Publish

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "23,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read  # the deploy step looks the build's artifact up through the Actions API

jobs:
  due:
    name: Is a forecast due?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.age.outputs.due }}
    steps:
      - id: age
        env:
          EVENT: ${{ github.event_name }}
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        # Pushes and manual runs always publish. A scheduled run publishes when the live forecast is old,
        # or when its age can't be read (first publish, site down).
        run: |
          python3 - <<'EOF'
          import json, os, time, urllib.request
          from datetime import datetime, timezone
          due, why = True, "not a scheduled run"
          if os.environ["EVENT"] == "schedule":
              try:
                  url = os.environ["SITE"] + "data/index.json?t=" + str(int(time.time()))
                  with urllib.request.urlopen(url, timeout=20) as r:
                      made = datetime.fromisoformat(json.load(r)["generated_at"])
                  minutes = (datetime.now(timezone.utc) - made).total_seconds() / 60
                  due, why = minutes >= 160, f"live forecast is {minutes:.0f} minutes old"
              except Exception as e:
                  why = f"age unknown ({e})"
          print(("due: " if due else "not due: ") + why)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print(f"due={str(due).lower()}", file=out)
          EOF

  build:
    name: Build and forecast
    needs: due
    # After CI only when every check passed; scheduled and manual runs publish main as it is.
    if: ${{ needs.due.outputs.due == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    # One publish at a time; a newer one waits rather than cancelling one already running. Set on the
    # jobs, not the workflow, so the half-hourly "due" checks never queue behind or cancel a publish.
    concurrency:
      group: pages-build
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VITE_PUBLIC_SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      VITE_PUBLIC_DATA: "1"
      TF_CPP_MIN_LOG_LEVEL: "3"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Security policy in the pages (from deploy/security-headers.conf)
        run: node scripts/pages-meta.mjs
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install the models' dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e ml
      - name: Run the models for every city
        working-directory: backend
        # A city Open-Meteo won't answer for keeps the forecast published last time (if under 12 hours old).
        run: python -m scripts.export_public_data ../dist/data "$VITE_PUBLIC_SITE"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  # A separate job, as in GitHub's own Pages example: deploying in the same job as the upload failed
  # to find the artifact, because GitHub hadn't finished registering it yet. One retry covers a
  # passing "try again later" from the Pages service.
  deploy:
    name: Publish
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.second.outputs.page_url || steps.first.outputs.page_url }}
    steps:
      - id: first
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: ${{ steps.first.outcome == 'failure' }}
        run: sleep 60
      - id: second
        if: ${{ steps.first.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
