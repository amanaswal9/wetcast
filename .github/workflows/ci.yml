# Runs every test on each push and pull request. Nothing here needs secrets or
# network services: API tests use SQLite and synthetic weather inputs.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (type-check, lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  python:
    name: Backend and ML (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TF_CPP_MIN_LOG_LEVEL: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            ml/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest
          pip install -e ml
      - name: ML pipeline tests
        working-directory: ml
        run: python -m pytest tests -q
      - name: API tests
        working-directory: backend
        run: python -m pytest tests -q
