[project]
name = "weatherai-ml"
version = "0.1.0"
description = "Wetcast training pipeline and shared preprocessing (used by training and by the API)."
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "httpx"]

[project.optional-dependencies]
train = ["tensorflow>=2.20", "lightgbm>=4.5", "scikit-learn", "pyarrow", "meteostat"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["weatherai_ml"]
