# Runs every test on each push and pull request, on Codeberg's hosted Forgejo Actions runners.
# Nothing here needs secrets or a backend: API tests use SQLite and synthetic weather inputs, and the
# browser tests answer every request from recorded files. Only Lighthouse fetches live weather.
#
# Codeberg runners (fair use, public free-software repos only): codeberg-small is 2 CPU, 4 GB,
# about 5 minutes; codeberg-medium is 4 CPU, 8 GB, about 10 minutes. Files written in the
# container count towards the RAM, so pip runs without its cache. Adding -lazy to a label
# (codeberg-medium-lazy) queues the job for a quieter time. See https://codeberg.org/actions/meta
#
# Jobs run in official Docker images. JavaScript actions such as checkout need node inside the
# container, so the Python jobs install the official Node.js build from nodejs.org first.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (type-check, lint, tests, build)
    runs-on: codeberg-medium
    container:
      image: node:22-bookworm
    timeout-minutes: 10
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Bundle-size budget
        run: npm run size

  browser:
    name: Browser journeys, accessibility and Lighthouse
    runs-on: codeberg-medium
    container:
      image: python:3.13-bookworm
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Node.js 22
        run: |
          base=https://nodejs.org/dist/latest-v22.x
          file=$(curl -fsSL "$base/SHASUMS256.txt" | awk '/linux-x64\.tar\.xz$/ {print $2}')
          curl -fsSLO "$base/$file"
          curl -fsSL "$base/SHASUMS256.txt" | grep " $file\$" | sha256sum -c -
          tar -xJf "$file" -C /usr/local --strip-components=1 --exclude='*.md' --exclude=LICENSE
          rm "$file"
          node --version
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --no-cache-dir pytest playwright
          python -m playwright install --with-deps chromium
      # Offline: every request is answered from e2e/fixtures. Reference screenshots are kept per
      # operating system (e2e/screenshots/linux here); a changed screenshot is uploaded below to look at.
      - name: Journeys, screenshots and accessibility
        run: python -m pytest e2e -q
      # Forgejo needs v3 or its own patched v4 of upload-artifact.
      - name: Keep the screenshots
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
          if-no-files-found: ignore
      # Phone-profile scores for four pages, using the Chromium Playwright installed above. Its packages
      # live in ci/lighthouse so the app's own npm ci stays small; see lighthouserc.js there for the limits.
      - name: Lighthouse (performance, accessibility, best practices, SEO)
        working-directory: ci/lighthouse
        run: |
          npm ci
          export CHROME_PATH=$(python -c "from playwright.sync_api import sync_playwright as s; p = s().start(); print(p.chromium.executable_path); p.stop()")
          npx lhci autorun
      - name: Keep the Lighthouse reports
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: ci/lighthouse/reports/
          if-no-files-found: ignore

  python:
    name: Backend and ML (pytest)
    runs-on: codeberg-medium
    container:
      image: python:3.13-bookworm
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      TF_CPP_MIN_LOG_LEVEL: "3"
      PIP_NO_CACHE_DIR: "1"
    steps:
      - name: Install Node.js 22 (for the checkout action)
        run: |
          base=https://nodejs.org/dist/latest-v22.x
          file=$(curl -fsSL "$base/SHASUMS256.txt" | awk '/linux-x64\.tar\.xz$/ {print $2}')
          curl -fsSLO "$base/$file"
          curl -fsSL "$base/SHASUMS256.txt" | grep " $file\$" | sha256sum -c -
          tar -xJf "$file" -C /usr/local --strip-components=1 --exclude='*.md' --exclude=LICENSE
          rm "$file"
          node --version
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Install dependencies
        run: |
          # scikit-learn: the chance-of-rain calibration the ML tests check is fitted with it.
          pip install -r backend/requirements.txt pytest scikit-learn
          pip install -e ml
      - name: ML pipeline tests
        working-directory: ml
        run: python -m pytest tests -q
      - name: API tests
        working-directory: backend
        run: python -m pytest tests -q

  # The public copy at https://amanaswal9.codeberg.page/wetcast/ (Codeberg Pages, free, https). Built from
  # this clean checkout, so nothing kept only on the owner's computer can end up in it, and published
  # only from main once every check above has passed. It has no Wetcast server: live weather only, and
  # the pages that need the server say so (src/lib/site.ts). The job's own token is enough to publish a
  # site named after its repository; no secret is needed.
  pages:
    name: Publish the public copy
    needs: [frontend, browser, python]
    if: ${{ forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main' }}
    runs-on: codeberg-small
    container:
      image: node:22-bookworm
    timeout-minutes: 10
    env:
      VITE_PUBLIC_SITE: https://${{ forgejo.repository_owner }}.codeberg.page/${{ forgejo.event.repository.name }}/
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - name: Security headers (from deploy/security-headers.conf)
        run: node scripts/pages-headers.mjs "$VITE_PUBLIC_SITE"
      - name: Publish
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: ${{ env.VITE_PUBLIC_SITE }}
          token: ${{ forgejo.token }}
          source: dist/
          strict: true
          comment: ${{ forgejo.sha }}
