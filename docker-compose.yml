# Full stack: docker compose up --build   (then open http://localhost:8080)
# Set POSTGRES_PASSWORD in a .env file next to this one; never commit it.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: weatherai
      POSTGRES_DB: weatherai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weatherai"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      WEATHERAI_DATABASE_URL: postgresql+psycopg://weatherai:${POSTGRES_PASSWORD}@db:5432/weatherai
      WEATHERAI_CORS_ORIGINS: '["http://localhost:8080"]'
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
